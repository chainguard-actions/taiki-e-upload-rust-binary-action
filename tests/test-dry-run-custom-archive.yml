name: Test dry-run with custom archive name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          bin: hello-world
          archive: '$bin-$tag-custom'
          manifest-path: tests/fixtures/rust-project/Cargo.toml
          tar: unix
          zip: none
          dry-run: 'true'
          dry-run-intended: 'true'
          ref: refs/tags/v3.0.0

      - name: Assert custom archive name is resolved correctly
        env:
          ARCHIVE: ${{ steps.action.outputs.archive }}
          TAR: ${{ steps.action.outputs.tar }}
        run: |
          echo "archive: $ARCHIVE"
          echo "tar: $TAR"
          if [ -z "$ARCHIVE" ]; then
            echo "FAIL: expected 'archive' output to be set"
            exit 1
          fi
          # The archive should contain the bin name, tag, and custom suffix
          if [[ "$ARCHIVE" != "hello-world-v3.0.0-custom" ]]; then
            echo "FAIL: expected archive to be 'hello-world-v3.0.0-custom', got: $ARCHIVE"
            exit 1
          fi
          if [ -z "$TAR" ]; then
            echo "FAIL: expected 'tar' output to be set"
            exit 1
          fi
          if [[ "$TAR" != "hello-world-v3.0.0-custom.tar.gz" ]]; then
            echo "FAIL: expected tar to be 'hello-world-v3.0.0-custom.tar.gz', got: $TAR"
            exit 1
          fi
          echo "PASS: archive=$ARCHIVE tar=$TAR"
