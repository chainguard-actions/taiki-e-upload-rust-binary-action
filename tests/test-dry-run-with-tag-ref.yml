name: Test dry-run with explicit tag ref
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up minimal Rust project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-project/src"
          cp "$GITHUB_WORKSPACE/tests/fixtures/hello-bin/Cargo.toml" "$GITHUB_WORKSPACE/test-project/Cargo.toml"
          cp "$GITHUB_WORKSPACE/tests/fixtures/hello-bin/src/main.rs" "$GITHUB_WORKSPACE/test-project/src/main.rs"

      - id: action
        uses: .
        with:
          bin: hello-bin
          manifest-path: test-project/Cargo.toml
          archive: '$bin-v1.2.3-$target'
          ref: refs/tags/v1.2.3
          tar: unix
          zip: none
          dry-run: 'true'
          dry-run-intended: 'true'

      - name: Assert archive output contains tag version
        env:
          ARCHIVE: ${{ steps.action.outputs.archive }}
        run: |
          echo "archive: $ARCHIVE"
          if [ -z "$ARCHIVE" ]; then
            echo "FAIL: expected 'archive' output to be non-empty"
            exit 1
          fi
          # Archive should start with the binary name and version
          if [[ "$ARCHIVE" != hello-bin-v1.2.3-* ]]; then
            echo "FAIL: expected archive to start with 'hello-bin-v1.2.3-', got '$ARCHIVE'"
            exit 1
          fi
          echo "PASS: archive output is '$ARCHIVE'"

      - name: Assert tar archive file exists on disk
        env:
          TAR: ${{ steps.action.outputs.tar }}
        run: |
          echo "tar: $TAR"
          if [ -z "$TAR" ]; then
            echo "FAIL: expected 'tar' output to be non-empty"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/$TAR" ]; then
            echo "FAIL: expected archive file '$TAR' to exist on disk"
            exit 1
          fi
          echo "PASS: archive file '$TAR' exists"
