name: Test build-tool and build_tool inputs in dry-run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Test with build-tool input
        id: action-build-tool
        uses: .
        with:
          bin: hello-world
          manifest-path: ${{ github.workspace }}/tests/fixtures/rust-project/Cargo.toml
          build-tool: cargo
          tar: unix
          zip: none
          ref: refs/tags/v0.1.0
          dry-run: true
          dry-run-intended: true

      - name: Assert archive output is set (build-tool)
        env:
          ARCHIVE: ${{ steps.action-build-tool.outputs.archive }}
        run: |
          echo "archive: $ARCHIVE"
          if [ -z "$ARCHIVE" ]; then
            echo "FAIL: expected 'archive' output to be set"
            exit 1
          fi
          echo "PASS: archive output is '$ARCHIVE'"

      - name: Test with build_tool alias input
        id: action-build-tool-alias
        uses: .
        with:
          bin: hello-world
          manifest-path: ${{ github.workspace }}/tests/fixtures/rust-project/Cargo.toml
          build_tool: cargo
          tar: unix
          zip: none
          ref: refs/tags/v0.1.0
          dry-run: true
          dry-run-intended: true

      - name: Assert archive output is set (build_tool alias)
        env:
          ARCHIVE: ${{ steps.action-build-tool-alias.outputs.archive }}
        run: |
          echo "archive: $ARCHIVE"
          if [ -z "$ARCHIVE" ]; then
            echo "FAIL: expected 'archive' output to be set"
            exit 1
          fi
          echo "PASS: archive output is '$ARCHIVE'"
