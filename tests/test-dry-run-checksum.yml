name: Test dry-run with checksum
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up minimal Rust project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-project/src"
          cp "$GITHUB_WORKSPACE/tests/fixtures/hello-bin/Cargo.toml" "$GITHUB_WORKSPACE/test-project/Cargo.toml"
          cp "$GITHUB_WORKSPACE/tests/fixtures/hello-bin/src/main.rs" "$GITHUB_WORKSPACE/test-project/src/main.rs"

      - id: action
        uses: .
        with:
          bin: hello-bin
          manifest-path: test-project/Cargo.toml
          tar: unix
          zip: none
          checksum: sha256
          dry-run: 'true'
          dry-run-intended: 'true'

      - name: Assert archive output is set
        env:
          ARCHIVE: ${{ steps.action.outputs.archive }}
        run: |
          echo "archive: $ARCHIVE"
          if [ -z "$ARCHIVE" ]; then
            echo "FAIL: expected 'archive' output to be non-empty"
            exit 1
          fi
          echo "PASS: archive output is '$ARCHIVE'"

      - name: Assert sha256 output is set
        env:
          SHA256: ${{ steps.action.outputs.sha256 }}
        run: |
          echo "sha256: $SHA256"
          if [ -z "$SHA256" ]; then
            echo "FAIL: expected 'sha256' output to be non-empty"
            exit 1
          fi
          if [[ "$SHA256" != *.sha256 ]]; then
            echo "FAIL: expected sha256 output to end with .sha256, got '$SHA256'"
            exit 1
          fi
          echo "PASS: sha256 output is '$SHA256'"

      - name: Assert sha256 checksum file exists
        env:
          SHA256: ${{ steps.action.outputs.sha256 }}
        run: |
          echo "Checking for checksum file: $SHA256"
          if [ ! -f "$GITHUB_WORKSPACE/$SHA256" ]; then
            echo "FAIL: expected checksum file '$SHA256' to exist"
            exit 1
          fi
          echo "PASS: checksum file exists"
          echo "Contents:"
          cat "$GITHUB_WORKSPACE/$SHA256"
